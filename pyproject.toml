[project]
name = "nonebot-plugin-taozi"
version = "0.5.0"
description = "图片化的有出处桃系词典与可选轻互动 NoneBot2 插件"
authors = [{ name = "TonyLiangP2010405" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
keywords = ["nonebot", "nonebot2", "onebot", "bilibili", "taozi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "nonebot2>=2.5.0,<3.0.0",
    "nonebot-adapter-onebot>=2.4.6,<3.0.0",
    "nonebot-plugin-localstore>=0.7.4,<1.0.0",
    "pydantic>=2.0,<3.0",
    "pillow>=11.0,<13.0",
    "qrcode>=8.2,<9.0",
    "skia-python>=144.0.post2,<145.0",
]

[project.urls]
Homepage = "https://github.com/TonyLiangP2010405/nonebot-plugin-taozi"
Repository = "https://github.com/TonyLiangP2010405/nonebot-plugin-taozi"
Issues = "https://github.com/TonyLiangP2010405/nonebot-plugin-taozi/issues"

[tool.poetry]
packages = [{ include = "nonebot_plugin_taozi" }]
include = [
    "nonebot_plugin_taozi/resources/*.json",
    "nonebot_plugin_taozi/resources/*.png",
]

[tool.poetry.group.dev.dependencies]
nonebug = ">=0.4.4,<1.0.0"
pytest = ">=8.0,<9.0"
pytest-asyncio = ">=0.24,<2.0"
ruff = ">=0.12,<1.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"nonebot_plugin_taozi/__init__.py" = ["E402"]

[tool.nonebot]
plugins = ["nonebot_plugin_taozi"]
